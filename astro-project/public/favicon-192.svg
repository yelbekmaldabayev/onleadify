<svg width="192" height="192" viewBox="0 0 192 192" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes spinClockwise {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes spinCounterClockwise {
      from { transform: rotate(0deg); }
      to { transform: rotate(-360deg); }
    }
    .white-orbit {
      transform-origin: 96px 96px;
      animation: spinClockwise 10s linear infinite;
    }
    .purple-orbit {
      transform-origin: 96px 96px;
      animation: spinCounterClockwise 8s linear infinite;
    }
  </style>
  <defs>
    <filter id="glow-white" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-purple" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="logo-gradient" x1="38.4" y1="38.4" x2="153.6" y2="153.6" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e4e4e7"/>
    </linearGradient>
    <linearGradient id="logo-gradient-2" x1="9.6" y1="96" x2="182.4" y2="96" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a78bfa"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <rect width="192" height="192" fill="#000000"/>
  <ellipse class="white-orbit" cx="96" cy="96" rx="67.2" ry="24" stroke="url(#logo-gradient)" stroke-width="9.6" fill="none" filter="url(#glow-white)" transform="rotate(60 96 96)"/>
  <ellipse class="purple-orbit" cx="96" cy="96" rx="76.8" ry="28.8" stroke="url(#logo-gradient-2)" stroke-width="12" fill="none" filter="url(#glow-purple)" transform="rotate(-30 96 96)"/>
</svg>
