<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1200px;
      height: 630px;
      background: linear-gradient(135deg, #0a0a0b 0%, #1a1a2e 50%, #0a0a0b 100%);
      font-family: 'Inter', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
    }
    .glow {
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(124, 58, 237, 0.3) 0%, transparent 70%);
      top: -100px;
      right: -100px;
      filter: blur(60px);
    }
    .glow-2 {
      position: absolute;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(120, 119, 198, 0.2) 0%, transparent 70%);
      bottom: -50px;
      left: -50px;
      filter: blur(40px);
    }
    .content {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 60px;
    }
    .logo {
      font-size: 28px;
      font-weight: 700;
      color: #fafafa;
      margin-bottom: 40px;
      letter-spacing: -0.02em;
    }
    .title {
      font-size: 64px;
      font-weight: 700;
      color: #fafafa;
      line-height: 1.1;
      margin-bottom: 24px;
      letter-spacing: -0.03em;
      max-width: 900px;
    }
    .subtitle {
      font-size: 24px;
      color: #a1a1aa;
      max-width: 700px;
      line-height: 1.5;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 8px 16px;
      border-radius: 100px;
      margin-bottom: 30px;
    }
    .badge-dot {
      width: 8px;
      height: 8px;
      background: #22c55e;
      border-radius: 50%;
    }
    .badge-text {
      font-size: 14px;
      color: #a1a1aa;
    }
  </style>
</head>
<body>
  <div class="glow"></div>
  <div class="glow-2"></div>
  <div class="content">
    <div class="badge">
      <div class="badge-dot"></div>
      <span class="badge-text">Веб-студия и AI-автоматизация</span>
    </div>
    <div class="logo">Onleadify</div>
    <div class="title">Мы строим системы, которые растят ваш бизнес</div>
    <div class="subtitle">Программное обеспечение, AI и автоматизация для компаний, которые хотят масштабироваться</div>
  </div>
</body>
</html>
