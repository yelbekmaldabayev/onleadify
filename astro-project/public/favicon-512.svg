<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes spinClockwise {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes spinCounterClockwise {
      from { transform: rotate(0deg); }
      to { transform: rotate(-360deg); }
    }
    .white-orbit {
      transform-origin: 256px 256px;
      animation: spinClockwise 10s linear infinite;
    }
    .purple-orbit {
      transform-origin: 256px 256px;
      animation: spinCounterClockwise 8s linear infinite;
    }
  </style>
  <defs>
    <filter id="glow-white" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-purple" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="19.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="logo-gradient" x1="102.4" y1="102.4" x2="409.6" y2="409.6" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e4e4e7"/>
    </linearGradient>
    <linearGradient id="logo-gradient-2" x1="25.6" y1="256" x2="486.4" y2="256" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a78bfa"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="#000000"/>
  <ellipse class="white-orbit" cx="256" cy="256" rx="179.2" ry="64" stroke="url(#logo-gradient)" stroke-width="25.6" fill="none" filter="url(#glow-white)" transform="rotate(60 256 256)"/>
  <ellipse class="purple-orbit" cx="256" cy="256" rx="204.8" ry="76.8" stroke="url(#logo-gradient-2)" stroke-width="32" fill="none" filter="url(#glow-purple)" transform="rotate(-30 256 256)"/>
</svg>
