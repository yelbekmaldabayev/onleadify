<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes spinClockwise {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes spinCounterClockwise {
      from { transform: rotate(0deg); }
      to { transform: rotate(-360deg); }
    }
    .white-orbit {
      transform-origin: 90px 90px;
      animation: spinClockwise 10s linear infinite;
    }
    .purple-orbit {
      transform-origin: 90px 90px;
      animation: spinCounterClockwise 8s linear infinite;
    }
  </style>
  <defs>
    <filter id="glow-white" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-purple" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6.75" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="logo-gradient" x1="36" y1="36" x2="144" y2="144" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e4e4e7"/>
    </linearGradient>
    <linearGradient id="logo-gradient-2" x1="9" y1="90" x2="171" y2="90" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a78bfa"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <rect width="180" height="180" fill="#000000"/>
  <ellipse class="white-orbit" cx="90" cy="90" rx="63" ry="22.5" stroke="url(#logo-gradient)" stroke-width="9" fill="none" filter="url(#glow-white)" transform="rotate(60 90 90)"/>
  <ellipse class="purple-orbit" cx="90" cy="90" rx="72" ry="27" stroke="url(#logo-gradient-2)" stroke-width="11.25" fill="none" filter="url(#glow-purple)" transform="rotate(-30 90 90)"/>
</svg>
